name: 'No new @ts-nocheck'
description: 'Runs a merge-base diff against the PR base branch and checks if new @ts-nochecks are added.'
author: 'Tanmay Rajani'
branding:
  icon: 'shield'
  color: 'green'

runs:
  using: 'composite'
  steps:
    - id: run-git-diff
      name: Run git diff
      run: ${{ github.action_path }}/diff.sh
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
